name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: educational_center
          POSTGRES_USER: educational_center
          POSTGRES_PASSWORD: educational_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educational_center -d educational_center"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: educational_center.settings_dev
      SECRET_KEY: django-insecure-ci-only
      POSTGRES_DB: educational_center
      POSTGRES_USER: educational_center
      POSTGRES_PASSWORD: educational_center
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Django system checks
        run: python backend/manage.py check

      - name: Run backend tests
        run: python backend/manage.py test academics finance users

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build frontend
        run: npm run build-only

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production images build
        env:
          ENV_FILE: .env.prod.example
        run: docker compose -f docker-compose.prod.yml build
